[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyretrotts"
dynamic = ["version"]
description = "Python ports of the classic formant speech synthesizers: MacinTalk and DECtalk"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OpenVoiceOS", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.10"
keywords = ["tts", "dectalk", "macintalk", "formant-synthesis", "speech-synthesis", "retro"]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0,<9",
    "pytest-timeout>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/pyretroTTS"
Repository = "https://github.com/TigreGotico/pyretroTTS"

[tool.setuptools]
packages = ["pyretrotts"]

[tool.setuptools.dynamic]
version = {attr = "pyretrotts.version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["pyretrotts/_data.py"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax
    "F",               # pyflakes
    "W",               # pycodestyle warnings
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["pyretrotts"]

[tool.ruff.lint.per-file-ignores]
# The C-oracle scripts bootstrap sys.path before importing the package.
"test/*" = ["E402"]
