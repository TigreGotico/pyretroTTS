[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyretrotts"
dynamic = ["version"]
description = "Python ports of the classic formant speech synthesizers: MacinTalk and DECtalk"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OpenVoiceOS", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.10"
keywords = ["tts", "dectalk", "macintalk", "formant-synthesis", "speech-synthesis", "retro"]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0,<9",
    "pytest-timeout>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/pyretroTTS"
Repository = "https://github.com/TigreGotico/pyretroTTS"

[tool.setuptools.packages.find]
include = ["pyretrotts*"]

[tool.setuptools.dynamic]
version = {attr = "pyretrotts.version.__version__"}

[tool.pytest.ini_options]
# The DECtalk/FONIX parity tests compare the port against the instrumented C
# oracle and the proprietary FONIX dictionary. Neither ships with the package,
# so those tests read as skipped in CI and hide whether the suite ran. They are
# marked `oracle` and deselected by default; run `pytest -m oracle` on a machine
# with the oracle and the dictionary present. A by-nodeid run of one also
# deselects it, so select with `-m oracle` there too.
markers = [
    "oracle: DECtalk/FONIX parity tests that need the instrumented C oracle and/or the FONIX dictionary",
]
addopts = "-m 'not oracle'"


[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["pyretrotts/_data.py"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax
    "F",               # pyflakes
    "W",               # pycodestyle warnings
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["pyretrotts"]

[tool.ruff.lint.per-file-ignores]
# The C-oracle scripts bootstrap sys.path before importing the package.
"test/*" = ["E402"]
